services:

  ccteam-app:
    depends_on:
      - ccteam-db
    build:
      context: ./
    container_name: ccteam-app
    restart: on-failure
    env_file: ./.env
    volumes:
      - /opt/apps/ccteam/path_to_firebase_key.json:/opt/firebase-key.json:ro
    environment:
      - TZ=Europe/Zurich
      - SPRING_DATASOURCE_URL=jdbc:mariadb://ccteam-db:3306/$MARIADB_DATABASE?useUnicode=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=$MARIADB_USER
      - SPRING_DATASOURCE_PASSWORD=$MARIADB_PASSWORD
      - SPRING_MAIL_HOST=$MAIL_SERVER_HOST
      - SPRING_MAIL_PORT=$MAIL_SERVER_PORT
      - SPRING_MAIL_USERNAME=$MAIL_SERVER_USERNAME
      - SPRING_MAIL_PASSWORD=$MAIL_SERVER_PASSWORD
      - CT_JWT_TOKEN_SECRET=$JWT_SECRET
      - CT_JWT_TOKEN_EXPIRATION-TIME=$JWT_EXPIRATION_TIME
      - CT_FIREBASE_SERVICEACCOUNTFILE=$FIREBASE_SERVICE_ACCOUNT_FILE
    networks:
      - ccteam-net
      - traefik-public-net
      # Scraped by Prometheus on the management port (8081), which is not routed by Traefik
      - prometheus-ccteam-net

  ccteam-db:
    image: mariadb:latest
    container_name: ccteam-db
    restart: unless-stopped
    env_file: ./.env
    environment:
      - MARIADB_AUTO_UPGRADE="1"
      - MARIADB_ROOT_PASSWORD=$MARIADB_ROOT_PASSWORD
      - MARIADB_DATABASE=$MARIADB_DATABASE
      - MARIADB_USER=$MARIADB_USER
      - MARIADB_PASSWORD=$MARIADB_PASSWORD
    volumes:
      - ccteam-db-vol:/var/lib/mysql
    networks:
      - ccteam-net
      - phpmyadmin-net

volumes:

  ccteam-db-vol:
    name: ccteam-db-vol

networks:

  ccteam-net:
    name: ccteam-net

  traefik-net:
    name: traefik-net
    external: true

  phpmyadmin-net:
    name: phpmyadmin-net
    external: true

  prometheus-ccteam-net:
    name: prometheus-ccteam-net
    external: true